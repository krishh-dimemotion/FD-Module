openapi: 3.0.3
info:
  title: Fixed Deposit (FD) Account Module API
  description: >
    REST API for the Fixed Deposit Account Module (Group 3), Banking Technology
    Lab (CSF 3142). Owns fd_db (MySQL). Covers account lifecycle, transactions,
    interest, early withdrawal, maturity/renewal, receipts, reporting, and
    batch-job triggers. See fd_module_api_justification.md for the
    action-to-endpoint mapping and the rationale for what was excluded.
  version: "1.0.0"
  contact:
    name: Group 3 — Fixed Deposit Module
servers:
  - url: https://api.banklab.local/fd/v1
    description: Gateway contract; local lab equivalent is http://localhost:8080/fd/v1. Local access is open; JWT resolution is future integration.

tags:
  - name: Accounts
    description: FD account creation, lookup, and lifecycle
  - name: Transactions
    description: Ledger entries against FD accounts
  - name: Interest
    description: Interest preview / calculation
  - name: Maturity
    description: Maturity payout and renewal
  - name: Receipts
    description: Term deposit receipt generation
  - name: Reports
    description: Reporting endpoints (report-service, reads fd_db directly)
  - name: Exchange Rates
    description: Dated local DEMO rates and illustrative conversion
  - name: Batch
    description: Admin-triggered batch job runs (accrual, maturity)

security:
  - bearerAuth: []

paths:
  /fd-accounts:
    post:
      tags: [Accounts]
      summary: Create FD account (Actions 1,2,3,4,5,6 — single atomic operation)
      description: >
        Creates a new FD account with its initial deposit transaction and at
        least one account role (owner), in one atomic write. Account number
        and account identifier are generated server-side. Maturity date is
        computed from open date + tenure at creation time and never
        recalculated. Terms (rate, interestType, compoundingFrequency) are
        snapshotted from the Product & Pricing module and never re-fetched.
      operationId: createFdAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFdAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdAccount'
        '400':
          description: >
            Validation error, or INVALID_PRINCIPAL — principal has more decimal
            places than the currency (or DECIMAL(18,2)) allows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product, rate, or customer-category mapping not found
        '409':
          description: >
            Role cardinality violation (e.g. more than one GUARANTOR/GUARDIAN
            for this account)
        '422':
          description: >
            Customer→category mapping unresolved (open item — blocks
            creation per Action 3 note)

    get:
      tags: [Accounts]
      summary: Search accounts (Action 7)
      operationId: searchFdAccounts
      parameters:
        - name: custId
          in: query
          schema: { type: string }
          description: Filter by owning customer (via FD_ACCOUNT_ROLES, role=CUSTOMER/OWNER)
        - name: acctNum
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, MATURED_CLOSED, MATURED_RENEWED, CLOSED]
        - name: productCode
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged list of matching accounts (role-scoped — a CUSTOMER-role
            caller only sees accounts they hold a role on)
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/FdAccountSummary' }
                  totalElements: { type: integer }
                  page: { type: integer }
                  size: { type: integer }

  /fd-accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: View account details (Action 8)
      description: >
        Includes FDA_ACCRUED_INT_AMT (interest accrued but not yet
        capitalized). Response projection is role-based — audit fields are
        excluded for CUSTOMER-role callers.
      operationId: getFdAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdAccount'
        '403':
          description: Caller has no role on this account
        '404':
          $ref: '#/components/responses/NotFound'

  /fd-accounts/{accountId}/roles:
    post:
      tags: [Accounts]
      summary: Assign role to account (Action 6)
      description: >
        Adds a joint holder, nominee, guarantor, guardian, or beneficiary to
        an existing account. Nominee is a role type value, not a distinct
        entity. No percentage-share field (dropped from schema). Cardinality
        caps (GUARANTOR/GUARDIAN: one each; BENEFICIARY: unlimited) are
        enforced by a filtered unique index and surfaced here as 409.
      operationId: assignAccountRole
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRole'
        '409':
          description: Role cardinality violation
        '404':
          $ref: '#/components/responses/NotFound'

  /fd-accounts/{accountId}/transactions:
    get:
      tags: [Transactions]
      summary: List transactions for an account
      description: >
        Read side of the shared FD_TRANSACTIONS writer used internally by
        Actions 5, 9, 11, 12, 14, 15. Exposed as a read endpoint so a caller
        can retrieve statement/ledger history for one account.
      operationId: listFdTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: txnType
          in: query
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAWAL, INTEREST, PENALTY, MATURITY_PAYOUT, TDS]
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/FdTransaction' }
                  totalElements: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /fd-accounts/{accountId}/interest-calculations:
    post:
      tags: [Interest]
      summary: Calculate interest — preview only (Action 10)
      description: >
        Pure computation, no persistence. Uses the account's snapshotted
        terms (rate, interestType, compoundingFrequency, currency +
        decimals) plus a caller-supplied period. Lets a customer or teller
        preview accrual for a hypothetical period without waiting for the
        nightly batch. Uses the account's snapshotted day-count convention —
        ACT/ACT (leap-year days / 366) for new accounts, pending Group 2
        confirmation. The start date counts, the end date doesn't.
      operationId: calculateInterestPreview
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodStart, periodEnd]
              properties:
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        '200':
          description: >
            Computed interest for the requested period. ACT/365 on each
            compounding sub-period (boundaries = periodStart + k × frequency months),
            capitalized at currency decimals — the same arithmetic as the batch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { $ref: '#/components/schemas/DecimalAmount' }
                  rate: { type: number, format: double }
                  periodStart: { type: string, format: date }
                  periodEnd: { type: string, format: date }
                  dayCountConvention: { type: string, example: "ACT/ACT" }
                  interestAmount: { $ref: '#/components/schemas/DecimalAmount' }
                  currencyCode: { type: string, example: "INR" }
                  interestType: { type: string, enum: [SIMPLE, COMPOUND] }
                  compoundingFrequency: { type: string }
                  payoutFrequency: { type: string }
                  days: { type: integer }
                  interestPaidOut: { $ref: '#/components/schemas/DecimalAmount' }
                  estimatedTax: { $ref: '#/components/schemas/DecimalAmount' }
                  taxEnabled: { type: boolean }
                  maturityValue: { $ref: '#/components/schemas/DecimalAmount' }
        '400':
          description: periodEnd before periodStart (INVALID_PERIOD)
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Account's snapshotted terms can't be calculated (INVALID_INTEREST_TERMS)

  /fd-accounts/{accountId}/withdrawal-quote:
    post:
      tags: [Accounts]
      summary: Preview full premature closure without changing account or ledger
      description: >
        Uses the current business date, snapshotted account terms, existing interest
        postings and the same calculation as withdraw. No accrual, ledger, audit or
        status writes. The withdrawal day earns no interest. Returns the same
        eligibility errors as withdraw. A quote is not a reservation; submit it as
        expectedQuote to withdraw so changes require another confirmation.
        Owner/BANK_OFFICER authorization awaits Group 1 JWT integration.
      security: []
      operationId: quoteEarlyWithdrawal
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Withdrawal quote on the current business date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalQuote' }
        '400':
          description: VALIDATION_ERROR (malformed account identifier)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ACCOUNT_NOT_ACTIVE, WITHDRAWAL_BEFORE_VALUE_DATE, ACCOUNT_MATURED, or ACCRUAL_AHEAD_OF_BUSINESS_DATE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: INVALID_INTEREST_TERMS (invalid snapshotted account terms)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fd-accounts/{accountId}/withdraw:
    post:
      tags: [Accounts]
      summary: Validate and process early withdrawal (Action 12)
      description: >
        Full closure only, on the current business date, under an account row lock
        and one transaction. Retains handoff option A: penalty = min(balance after
        final interest, round(lifetime interest earned * penalty-pct / 100 + flat-fee)).
        Config keys fd.premature-withdrawal.penalty-pct (default 1.00) and
        fd.premature-withdrawal.flat-fee (default 0.00). Includes SIMPLE interest
        previously paid out in the penalty base; this can reduce principal.
        No minimum holding period. Currency decimals and HALF_UP rounding once on
        the combined fee. Same-day interest is zero; only the flat fee applies.
        Catch-up accrual uses booked terms and excludes the withdrawal day.
        Final INTEREST, PENALTY and WITHDRAWAL share one FDT_TXN_GRP_ID;
        catch-up boundary postings retain their own groups. All writes roll back
        together on failure. Status becomes CLOSED; balances become zero.
        Remarks are saved on WITHDRAWAL, or PENALTY when the fee consumes the full
        balance (no zero-amount ledger row). Payout uses existing FD_SETTLEMENT.
        A supplied expectedQuote must still match under the lock or closure is
        rejected with WITHDRAWAL_QUOTE_CHANGED. Existing clients may omit it.
        Group 2 pricing confirmation, Group 1 authorization and the maturity
        team's PREMATURE_CLOSURE notification writer remain integration dependencies.
      security: []
      operationId: processEarlyWithdrawal
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0
                  exclusiveMinimum: true
                  description: Optional legacy field; must equal the stored principalBal before catch-up, not the quoted payout. Omit for quote-confirm flow.
                remarks: { type: string, maxLength: 255 }
                expectedQuote:
                  $ref: '#/components/schemas/WithdrawalQuote'
      responses:
        '200':
          description: Withdrawal processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrematureWithdrawalResult'
        '400':
          description: VALIDATION_ERROR (malformed identifier/body, nonpositive amount, incomplete expectedQuote or remarks over 255 characters)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            ACCOUNT_NOT_ACTIVE, WITHDRAWAL_BEFORE_VALUE_DATE, ACCOUNT_MATURED
            (on/after maturity it's maturity processing),
            ACCRUAL_AHEAD_OF_BUSINESS_DATE (interest already accrued past the
            business date), PARTIAL_WITHDRAWAL_NOT_SUPPORTED, or WITHDRAWAL_QUOTE_CHANGED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: INVALID_INTEREST_TERMS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: GL_ACCOUNT_NOT_CONFIGURED; the entire closure is rolled back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fd-accounts/{accountId}/renew:
    post:
      tags: [Maturity]
      summary: Process maturity — renew (Action 15)
      description: >
        Customer-initiated, manual. Opens a new linked FD_ACCOUNTS row (new
        account number) referencing this account via FDA_RENEWED_FROM_ID,
        and closes this account as MATURED_RENEWED. Must be called before the
        maturity batch job (Action 14) processes this account, or the batch
        will instead close it as a straight payout.
      operationId: renewFdAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenureMonths:
                  type: integer
                  description: Optional override; defaults to original tenure
      responses:
        '201':
          description: New account created, old account closed as MATURED_RENEWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdAccount'
        '409':
          description: Account not yet matured, or already closed
        '404':
          $ref: '#/components/responses/NotFound'

  /fd-accounts/{accountId}/receipt:
    get:
      tags: [Receipts]
      summary: Issue term deposit receipt (Action 16)
      description: >
        Generates the receipt document on demand; not persisted. Issuance
        itself is logged as an FDNT_EVENT_TYP='FDR_ISSUED' row in
        FD_NOTIFICATION_LOG for audit purposes.
      operationId: getFdReceipt
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: format
          in: query
          schema: { type: string, enum: [pdf, json], default: pdf }
      responses:
        '200':
          description: Receipt document
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/fd-accounts:
    get:
      tags: [Reports]
      security: []
      summary: Generate portfolio, liability, growth, compliance, maturity or statement reports
      description: >
        Local lab demo: custId is an operations filter, not authenticated customer identity.
        The separate report service reads fd_db with SELECT-only credentials and calls no
        upstream services. Dates are inclusive business posting dates. Portfolio dates
        filter opening dates; liability is the current stored position and rejects date filters.
        Growth defaults to twelve calendar months through the business date; TDS defaults
        to April 1 through the business date; statements default to account opening through
        the business date. Maturity defaults to business date through twelve months ahead.
        Only maturity schedules allow future toDate. Monetary values are decimal strings;
        totals remain separate by currency. PDF covers all six report types. TDS_COMPLIANCE is a demo withholding summary, not a statutory certificate. Engine tax financial years use settlement value dates. See README for accounting definitions.
      operationId: getFdAccountReport
      parameters:
        - { name: reportType, in: query, required: true, schema: { $ref: '#/components/schemas/ReportType' } }
        - { name: custId, in: query, schema: { type: string }, description: 'Primary customer or OWNER role; operations/demo filter.' }
        - { name: accountId, in: query, schema: { type: string, format: uuid }, description: Required for ACCOUNT_STATEMENT; optional account filter for other types. }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv, pdf], default: json } }
      responses:
        '200':
          description: Report rows and totals, a CSV attachment, or a paginated PDF with identical report data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: "Missing or invalid parameter, invalid date range, or unsupported liability date filters." }
        '404': { description: "Selected account does not exist or does not match custId." }
        '422': { description: "INCOMPLETE_LEDGER_HISTORY, INCOMPLETE_ACCOUNT_BALANCE, or INVALID_CURRENCY_PRECISION." }
        '503': { description: "REPORT_DATA_UNAVAILABLE." }

  /exchange-rates:
    get:
      tags: [Exchange Rates]
      security: []
      operationId: getDemoExchangeRates
      summary: Look up dated local demo exchange rates
      description: >
        Invented DEMO data only. Selects the latest configured rate set on or before date;
        defaults to the business date. Rates are currency units per one unit of base.
        No rate is selected from the future. This does not convert report totals or postings.
      parameters:
        - { name: base, in: query, schema: { type: string, default: INR } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Effective dated demo rate set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRateSet' }
        '400': { description: "Invalid ISO currency or date." }
        '404': { description: "CURRENCY_NOT_SUPPORTED or RATE_NOT_FOUND." }

  /exchange-rates/convert:
    get:
      tags: [Exchange Rates]
      security: []
      operationId: convertDemoCurrency
      summary: Convert an amount using dated local demo rates
      description: >
        Decimal arithmetic; HALF_UP rounding to the target currency's minor units.
        amount must be nonnegative, with at most 30 significant digits and scale between -12 and 12.
        Defaults to the business date when date is omitted.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: amount, in: query, required: true, schema: { $ref: '#/components/schemas/DecimalAmount' } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Illustrative conversion with effective date and DEMO source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeConversion' }
        '400': { description: "Invalid amount, currency or date." }
        '404': { description: "CURRENCY_NOT_SUPPORTED or RATE_NOT_FOUND." }

  /batch-jobs/{jobName}/runs:
    post:
      tags: [Batch]
      summary: Trigger a batch job run (Action 17) — admin/ops only
      description: >
        Manual trigger for the accrual or maturity batch job, for ops use
        outside the scheduled run (e.g. re-run after a failure). Application
        still multithreads internally; FD_BATCH_RUN_LOG records one summary
        row per run (not per partition/thread). Idempotency is enforced via
        FDA_LAST_ACCRUAL_DT, so a duplicate trigger for an already-processed
        business date is a no-op, not an error. ACCRUAL for business date D
        accrues interest for every day up to and including D (daily GL entries
        Dr FD_INT_EXP / Cr FD_INT_PAYABLE); MATURITY for D closes accounts whose
        maturity date is on or before D. businessDate may not be after
        FD_BUSINESS_CLOCK (409 BUSINESS_DATE_AFTER_CLOCK).
      operationId: triggerBatchRun
      parameters:
        - name: jobName
          in: path
          required: true
          schema:
            type: string
            enum: [ACCRUAL, MATURITY]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessDate]
              properties:
                businessDate: { type: string, format: date }
      responses:
        '202':
          description: Batch run accepted/queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '403':
          description: Caller lacks ops/admin role
        '409':
          description: >
            BUSINESS_DATE_AFTER_CLOCK (businessDate is later than FD_BUSINESS_CLOCK —
            advance the clock first) or BATCH_ALREADY_RUNNING

    get:
      tags: [Batch]
      summary: List recent batch job runs (latest 50, or all runs for businessDate)
      operationId: listBatchRuns
      parameters:
        - name: jobName
          in: path
          required: true
          schema:
            type: string
            enum: [ACCRUAL, MATURITY]
        - name: businessDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Batch run history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BatchRun' }

  /business-clock:
    get:
      tags: [Batch]
      summary: Current business date (FD_BUSINESS_CLOCK)
      operationId: getBusinessClock
      responses:
        '200':
          description: Business clock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessClock' }
    put:
      tags: [Batch]
      summary: Set the business date ("time travel", testing/demo)
      operationId: setBusinessDate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessDate]
              properties:
                businessDate: { type: string, format: date }
      responses:
        '200':
          description: Updated clock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessClock' }

  /business-clock/advance:
    post:
      tags: [Batch]
      summary: Move the business date forward by N days
      operationId: advanceBusinessDate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated clock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessClock' }

  /business-clock/eod:
    post:
      tags: [Batch]
      summary: Run end of day now — ACCRUAL then MATURITY for the business date, then advance one day
      description: >
        Same cycle the scheduler runs automatically at 12:00 am Asia/Kolkata
        (fd.batch.eod-cron / fd.batch.eod-zone), which also replays any missed
        business dates. The date is not advanced if either job FAILED.
      operationId: runEndOfDay
      responses:
        '200':
          description: EOD result
          content:
            application/json:
              schema:
                type: object
                properties:
                  businessDate: { type: string, format: date }
                  accrual: { $ref: '#/components/schemas/BatchRun' }
                  maturity: { $ref: '#/components/schemas/BatchRun' }
                  clock: { $ref: '#/components/schemas/BusinessClock' }
        '409':
          description: Another batch run is in progress (BATCH_ALREADY_RUNNING)

  /gl-accounts:
    get:
      tags: [Batch]
      summary: FD_GL_ACCOUNTS with running balances
      operationId: listGlAccounts
      responses:
        '200':
          description: GL accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    glCd: { type: string }
                    name: { type: string }
                    type: { type: string, enum: [ASSET, LIABILITY, INCOME, EXPENSE] }
                    currencyCode: { type: string }
                    currentBalance: { $ref: '#/components/schemas/DecimalAmount' }
                    active: { type: boolean }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Issued by Login & Auth module (AUTH_USERS). Carries role/identity
        claims only — FD module resolves USR_ID -> CUST_ID via the gateway,
        never joins to AUTH_USERS directly (separate database).

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: FDA_ID

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    CreateFdAccountRequest:
      type: object
      required: [custId, productCode, principal, tenureMonths, rateId]
      properties:
        custId: { type: string }
        productCode: { type: string }
        principal: { $ref: '#/components/schemas/DecimalInput' }
        tenureMonths: { type: integer }
        rateId:
          type: string
          maxLength: 20
          description: >
            Logical FK to PRODUCT_RATE_MATRIX row — required, the contracted rate is
            snapshotted from it (404 if unknown, 422 if it carries no rate). Planned:
            resolved from productCode by Group 2 once their service provides it.
        categoryCd:
          type: string
          description: >
            Customer category code. NOTE — open item: no confirmed
            customer->category mapping exists yet from the Customer module;
            requests may 422 until resolved.
        currencyCode: { type: string, example: "INR" }
        payoutFreq:
          type: string
          description: Kept distinct from compounding frequency
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, ANNUALLY, ON_MATURITY]
        compoundingFreq:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, ANNUALLY]
        interestType:
          type: string
          enum: [SIMPLE, COMPOUND]
          description: >
            Snapshotted to FDA_INT_TYP. Optional — omitted means the product's
            defaultInterestType from Group 2, else fd.interest.default-interest-type
            (COMPOUND). COMPOUND capitalizes at compoundingFreq boundaries; SIMPLE pays
            interest out at payoutFreq boundaries (or at maturity for ON_MATURITY).
        maturityInstruction:
          type: string
          enum: [PAYOUT, RENEW]
        initialRoles:
          type: array
          items: { $ref: '#/components/schemas/AssignRoleRequest' }
          description: At least one role (typically OWNER) required at creation

    AssignRoleRequest:
      type: object
      required: [custId, roleType]
      properties:
        custId: { type: string }
        roleType:
          type: string
          enum: [OWNER, JOINT_HOLDER, NOMINEE, GUARANTOR, GUARDIAN, BENEFICIARY]
        isPrimary: { type: boolean }

    AccountRole:
      allOf:
        - $ref: '#/components/schemas/AssignRoleRequest'
        - type: object
          properties:
            fdrlId: { type: string }
            fdaId: { type: string }
            efctvDt: { type: string, format: date }

    FdAccountSummary:
      type: object
      properties:
        fdaId: { type: string }
        acctNum: { type: string }
        status: { type: string }
        principalBal: { $ref: '#/components/schemas/DecimalAmount' }
        matDt: { type: string, format: date }
        productCode: { type: string }
        custNameSnap: { type: string }
        currencyCode: { type: string }
        ccyDecimals: { type: integer }

    FdAccount:
      type: object
      properties:
        fdaId: { type: string }
        acctNum: { type: string }
        custId: { type: string }
        productCode: { type: string }
        rateId: { type: string, nullable: true }
        categoryCd: { type: string, nullable: true }
        currencyCode: { type: string }
        principalAmt: { $ref: '#/components/schemas/DecimalAmount' }
        principalBal: { $ref: '#/components/schemas/DecimalAmount' }
        accruedIntAmt: { $ref: '#/components/schemas/DecimalAmount' }
        intRt: { type: number, format: double, nullable: true }
        interestType: { type: string, enum: [SIMPLE, COMPOUND] }
        compoundFreq: { type: string, nullable: true }
        payoutFreq: { type: string, nullable: true }
        dayCountConv: { type: string, nullable: true }
        tenureMonths: { type: integer }
        openDt: { type: string, format: date }
        valueDt: { type: string, format: date }
        matDt: { type: string, format: date }
        matAmt: { $ref: '#/components/schemas/NullableDecimalAmount' }
        matInstruction: { type: string }
        status:
          type: string
          enum: [ACTIVE, MATURED_CLOSED, MATURED_RENEWED, CLOSED]
        lastAccrualDt: { type: string, format: date, nullable: true }
        lastCaptlzDt: { type: string, format: date, nullable: true }
        closureDt: { type: string, format: date, nullable: true }
        renewedFromId: { type: string, nullable: true }
        custNameSnap: { type: string, nullable: true }
        prdNameSnap: { type: string, nullable: true }
        taxEnabled: { type: boolean, description: Demo withholding eligibility snapshotted at booking; legacy accounts are false }
        ccyDecimals: { type: integer }

    FdTransaction:
      type: object
      properties:
        fdtId: { type: integer, format: int64 }
        fdaId: { type: string }
        txnGrpId: { type: string }
        txnType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, INTEREST, PENALTY, MATURITY_PAYOUT, TDS]
        drCr: { type: string, enum: [D, C] }
        amt: { $ref: '#/components/schemas/DecimalAmount' }
        balBefore: { $ref: '#/components/schemas/DecimalAmount' }
        balAfter: { $ref: '#/components/schemas/DecimalAmount' }
        ccyCd: { type: string }
        txnDt: { type: string, format: date }
        valueDt: { type: string, format: date }
        txnTs: { type: string, format: date-time }
        tdsRt: { type: number, format: double, nullable: true }
        remarks: { type: string }

    Receipt:
      type: object
      properties:
        fdaId: { type: string }
        acctNum: { type: string }
        custNameSnap: { type: string }
        principalAmt: { $ref: '#/components/schemas/DecimalAmount' }
        intRt: { type: number, format: double }
        openDt: { type: string, format: date }
        matDt: { type: string, format: date }
        matAmt: { $ref: '#/components/schemas/DecimalAmount' }
        issuedTs: { type: string, format: date-time }

    WithdrawalQuote:
      type: object
      required: [withdrawalDate, interestEarned, finalInterest, penaltyApplied, withdrawalAmount]
      properties:
        withdrawalDate: { type: string, format: date }
        interestEarned: { $ref: '#/components/schemas/DecimalAmount' }
        finalInterest: { $ref: '#/components/schemas/DecimalAmount' }
        penaltyApplied: { $ref: '#/components/schemas/DecimalAmount' }
        withdrawalAmount: { $ref: '#/components/schemas/DecimalAmount' }
        taxDeducted: { $ref: '#/components/schemas/DecimalAmount' }
      example:
        withdrawalDate: '2026-07-16'
        interestEarned: '3525.06'
        finalInterest: '275.80'
        penaltyApplied: '35.25'
        withdrawalAmount: '103489.81'
        taxDeducted: '0.00'

    PrematureWithdrawalResult:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        withdrawalDate: { type: string, format: date }
        interestEarned: { $ref: '#/components/schemas/DecimalAmount' }
        finalInterest: { $ref: '#/components/schemas/DecimalAmount' }
        penaltyApplied: { $ref: '#/components/schemas/DecimalAmount' }
        withdrawalAmount: { $ref: '#/components/schemas/DecimalAmount' }
        taxDeducted: { $ref: '#/components/schemas/DecimalAmount' }
        account: { $ref: '#/components/schemas/FdAccount' }
        txnGrpId: { type: string, format: uuid, description: Closure event reference }
        transactionIds:
          type: array
          description: Final interest, tax, penalty and withdrawal row IDs in the closure group
          items: { type: integer, format: int64 }

    BusinessClock:
      type: object
      properties:
        entityCd: { type: string }
        businessDate: { type: string, format: date }
        previousBusinessDate: { type: string, format: date, nullable: true }
        eodStatus: { type: string, enum: [OPEN, RUNNING, COMPLETED, FAILED] }
        lastEodTs: { type: string, format: date-time, nullable: true }

    BatchRun:
      type: object
      properties:
        fdjbId: { type: integer, format: int64 }
        jobName: { type: string, enum: [ACCRUAL, MATURITY] }
        businessDt: { type: string, format: date }
        status:
          type: string
          enum: [RUNNING, SUCCESS, FAILED, PARTIAL]
          description: >
            FDJB_STS uses this enum (resolves the ERD doc's RUNNING/COMPLETED/FAILED).
            PARTIAL = completed with skipped accounts (skipCnt > 0).
        readCnt: { type: integer }
        writeCnt: { type: integer }
        skipCnt: { type: integer }
        startTs: { type: string, format: date-time }
        endTs: { type: string, format: date-time }
        errorMsg: { type: string, nullable: true }

    DecimalInput:
      description: Exact decimal strings are preferred; JSON numbers remain accepted for compatibility.
      oneOf:
        - { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        - { type: number }

    NullableDecimalAmount:
      type: string
      nullable: true
      pattern: '^-?[0-9]+(\.[0-9]+)?$'

    DecimalAmount:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '100000.00'
    ReportType:
      type: string
      enum: [PORTFOLIO_SUMMARY, TDS_COMPLIANCE, MATURITY_SCHEDULE, TOTAL_LIABILITY, MONTHLY_GROWTH, ACCOUNT_STATEMENT]

    AccountReportRow:
      type: object
      required: ["accountId", "accountNumber", "customerId", "productCode", "currency", "status", "customerName", "productName", "openDate", "maturityDate", "principal", "depositBalance", "accruedInterest", "totalLiability", "projectedMaturityAmount"]
      properties:
        accountId: {"type": "string"}
        accountNumber: {"type": "string"}
        customerId: {"type": "string"}
        productCode: {"type": "string"}
        currency: {"type": "string"}
        status: {"type": "string"}
        customerName: {"type": "string", "nullable": true}
        productName: {"type": "string", "nullable": true}
        openDate: {"type": "string", "format": "date"}
        maturityDate: {"type": "string", "format": "date"}
        principal: {"$ref": "#/components/schemas/DecimalAmount"}
        depositBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        accruedInterest: {"$ref": "#/components/schemas/DecimalAmount"}
        totalLiability: {"$ref": "#/components/schemas/DecimalAmount"}
        projectedMaturityAmount: {"type": "string", "nullable": true}

    GrowthReportRow:
      type: object
      required: ["month", "currency", "fromDate", "toDate", "openingBalance", "closingBalance", "netGrowth", "newDeposits", "closurePayouts", "renewalIn", "renewalOut", "growthPercent", "accountsOpened", "accountsClosed"]
      properties:
        month: {"type": "string"}
        currency: {"type": "string"}
        fromDate: {"type": "string", "format": "date"}
        toDate: {"type": "string", "format": "date"}
        openingBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        closingBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        netGrowth: {"$ref": "#/components/schemas/DecimalAmount"}
        newDeposits: {"$ref": "#/components/schemas/DecimalAmount"}
        closurePayouts: {"$ref": "#/components/schemas/DecimalAmount"}
        renewalIn: {"$ref": "#/components/schemas/DecimalAmount"}
        renewalOut: {"$ref": "#/components/schemas/DecimalAmount"}
        growthPercent: {"type": "string", "nullable": true, "description": "Four decimals; null when opening balance is zero."}
        accountsOpened: {"type": "integer", "format": "int64"}
        accountsClosed: {"type": "integer", "format": "int64"}

    TdsReportRow:
      type: object
      required: ["accountId", "accountNumber", "customerId", "currency", "financialYear", "customerName", "pan", "taxRate", "transactionId", "date", "netDeduction"]
      properties:
        accountId: {"type": "string"}
        accountNumber: {"type": "string"}
        customerId: {"type": "string"}
        currency: {"type": "string"}
        financialYear: {"type": "string"}
        customerName: {"type": "string", "nullable": true}
        pan: {"type": "string", "nullable": true}
        taxRate: {"type": "string", "nullable": true}
        transactionId: {"type": "integer", "format": "int64"}
        date: {"type": "string", "format": "date"}
        netDeduction: {"$ref": "#/components/schemas/DecimalAmount"}
        policyVersion: { type: string, nullable: true }
        taxableAmount: { type: string, nullable: true }

    StatementReportRow:
      type: object
      required: ["type", "direction", "currency", "transactionId", "date", "amount", "balanceChange", "runningBalance", "remarks"]
      properties:
        type: {"type": "string"}
        direction: {"type": "string"}
        currency: {"type": "string"}
        transactionId: {"type": "integer", "format": "int64"}
        date: {"type": "string", "format": "date"}
        amount: {"$ref": "#/components/schemas/DecimalAmount"}
        balanceChange: {"$ref": "#/components/schemas/DecimalAmount"}
        runningBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        remarks: {"type": "string", "nullable": true}

    CurrencyReportTotal:
      type: object
      required: ["currency", "accountCount", "depositBalance", "accruedInterest", "totalLiability"]
      properties:
        currency: {"type": "string"}
        accountCount: {"type": "integer", "format": "int64"}
        depositBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        accruedInterest: {"$ref": "#/components/schemas/DecimalAmount"}
        totalLiability: {"$ref": "#/components/schemas/DecimalAmount"}

    TdsReportTotal:
      type: object
      required: ["customerId", "financialYear", "currency", "netDeduction"]
      properties:
        customerId: {"type": "string"}
        financialYear: {"type": "string"}
        currency: {"type": "string"}
        netDeduction: {"$ref": "#/components/schemas/DecimalAmount"}

    StatementReportTotal:
      type: object
      required: ["accountId", "accountNumber", "customerId", "currency", "customerName", "openingBalance", "closingBalance"]
      properties:
        accountId: {"type": "string"}
        accountNumber: {"type": "string"}
        customerId: {"type": "string"}
        currency: {"type": "string"}
        customerName: {"type": "string", "nullable": true}
        openingBalance: {"$ref": "#/components/schemas/DecimalAmount"}
        closingBalance: {"$ref": "#/components/schemas/DecimalAmount"}

    ReportResult:
      type: object
      required: ["reportType", "generatedAt", "businessDate", "fromDate", "toDate", "rows", "totals", "warnings"]
      properties:
        reportType: {"$ref": "#/components/schemas/ReportType"}
        generatedAt: {"type": "string", "format": "date-time"}
        businessDate: {"type": "string", "format": "date"}
        fromDate: {"type": "string", "format": "date", "nullable": true}
        toDate: {"type": "string", "format": "date"}
        rows: {"type": "array", "items": {"anyOf": [{"$ref": "#/components/schemas/AccountReportRow"}, {"$ref": "#/components/schemas/GrowthReportRow"}, {"$ref": "#/components/schemas/TdsReportRow"}, {"$ref": "#/components/schemas/StatementReportRow"}]}}
        totals: {"type": "array", "items": {"anyOf": [{"$ref": "#/components/schemas/CurrencyReportTotal"}, {"$ref": "#/components/schemas/TdsReportTotal"}, {"$ref": "#/components/schemas/StatementReportTotal"}]}}
        warnings: {"type": "array", "items": {"type": "string"}}

    ExchangeRateSet:
      type: object
      required: ["source", "base", "requestedDate", "effectiveDate", "rates"]
      properties:
        source: {"type": "string", "enum": ["DEMO"]}
        base: {"type": "string"}
        requestedDate: {"type": "string", "format": "date"}
        effectiveDate: {"type": "string", "format": "date"}
        rates: {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/DecimalAmount"}}

    ExchangeConversion:
      type: object
      required: ["source", "from", "to", "requestedDate", "effectiveDate", "amount", "rate", "convertedAmount"]
      properties:
        source: {"type": "string", "enum": ["DEMO"]}
        from: {"type": "string"}
        to: {"type": "string"}
        requestedDate: {"type": "string", "format": "date"}
        effectiveDate: {"type": "string", "format": "date"}
        amount: {"$ref": "#/components/schemas/DecimalAmount"}
        rate: {"$ref": "#/components/schemas/DecimalAmount"}
        convertedAmount: {"$ref": "#/components/schemas/DecimalAmount"}
