spring.application.name=reportservice
server.port=8083
spring.datasource.url=${REPORT_DB_URL:jdbc:mysql://localhost:3306/fd_db}
spring.datasource.username=${REPORT_DB_USER:fd_report}
spring.datasource.password=${REPORT_DB_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_REPEATABLE_READ
spring.sql.init.mode=never
fd.fx.rates-location=${FX_RATES_LOCATION:classpath:demo-rates.properties}
